<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WELL WAY 管理后台</title>
  <style>
    :root {
      --ink:#111; --bg:#F4F4F2; --card:#fff; --text:#17181A; --sub:#8A8F98;
      --line:#E9EAEC; --danger:#D84040; --success:#1E8A5A; --warn:#B7791F;
      --nav-w:232px; --radius:14px;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,"PingFang SC",sans-serif; background:var(--bg); color:var(--text); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 1px 3px rgba(17,17,17,.04); }
    input, select, textarea { width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:#fff; color:var(--text); outline:none; transition:border-color .15s; }
    input:focus, select:focus, textarea:focus { border-color:var(--ink); }
    label { font-size:12px; color:var(--sub); display:block; margin:10px 0 4px; letter-spacing:.02em; }
    label .req { color:var(--danger); margin-left:3px; }
    label .opt { color:#B6BEC9; font-size:11px; margin-left:6px; }
    button { cursor:pointer; border:none; border-radius:10px; font-size:14px; padding:8px 15px; font-weight:600; transition:all .15s; }
    .btn-primary { background:var(--ink); color:#fff; }
    .btn-primary:hover { background:#333; }
    .btn-ghost { background:#F0F1F3; color:var(--text); }
    .btn-ghost:hover { background:#E4E6E9; }
    .btn-danger { background:#FBECEC; color:var(--danger); }
    .btn-danger:hover { background:#F7DCDC; }
    .btn-sm { padding:5px 10px; font-size:12px; border-radius:8px; }
    .legal-links { margin-top:18px; text-align:center; font-size:12px; color:var(--sub); }
    .legal-links a { color:var(--sub); text-decoration:underline; margin:0 6px; }
    .legal-doc { max-width:720px; margin:0 auto; padding:40px 24px 80px; color:#17181c; font:15px/1.9 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
    .legal-doc h1 { font-size:24px; margin:0 0 4px; }
    .legal-doc .meta { color:#8a8a8e; font-size:13px; margin-bottom:32px; }
    .legal-doc h2 { font-size:17px; margin:28px 0 8px; }
    .legal-doc p { margin:8px 0; }
    .legal-doc ul { margin:8px 0; padding-left:20px; }
    .legal-doc li { margin:4px 0; }
    .legal-doc a { color:#17181c; }
    .legal-doc .back { display:inline-block; margin-bottom:24px; font-size:13px; color:var(--sub); text-decoration:none; }
    .legal-doc .back:hover { color:var(--ink); }
    .legal-page #login, .legal-page #app, .legal-page #resetpw { display:none !important; }

    /* ---------- 登录 ---------- */
    #login { max-width:400px; margin:12vh auto; padding:38px 34px; }
    #login .brand { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    #login .brand svg { height:26px; width:auto; }
    #login h1 { font-size:24px; letter-spacing:.01em; }
    #login p { color:var(--sub); font-size:13px; margin:8px 0 20px; }
    .err { color:var(--danger); font-size:13px; margin-top:8px; min-height:18px; }
    #forgot { display:inline-block; margin-top:12px; font-size:13px; color:var(--sub); cursor:pointer; text-decoration:underline; }
    #forgot:hover { color:var(--ink); }
    #resetpw { display:none; max-width:400px; margin:12vh auto; padding:38px 34px; }
    #resetpw .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:22px; }

    /* ---------- 弹窗 ---------- */
    #modal, #pwmodal, #forgotmodal { display:none; position:fixed; inset:0; background:rgba(17,17,17,.42); z-index:30; overflow-y:auto; }
    #modal .box, #pwmodal .box, #forgotmodal .box { max-width:620px; margin:5vh auto; padding:24px 26px; }
    #pwmodal .box, #forgotmodal .box { max-width:420px; }
    #modal h3, #pwmodal h3, #forgotmodal h3 { font-size:17px; margin-bottom:14px; font-weight:700; }
    #modal .actions, #pwmodal .actions, #forgotmodal .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
    .fgroup { border-top:1px solid var(--line); margin-top:14px; padding-top:4px; }
    .fgroup:first-of-type { border-top:none; margin-top:0; padding-top:0; }
    .fgroup h4 { font-size:12px; color:var(--sub); font-weight:700; letter-spacing:.06em; margin:12px 0 2px; display:flex; align-items:center; gap:6px; }
    .fgroup h4::before { content:''; width:3px; height:12px; background:var(--ink); border-radius:2px; }
    .frow { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
    .frow .full { grid-column:1 / -1; }
    .chk { display:flex; align-items:center; gap:8px; margin-top:14px; }
    .chk input { width:auto; }
    .chk label { margin:0; font-size:13px; color:var(--text); }
    .imgprev { width:72px; height:72px; object-fit:cover; border-radius:10px; margin-top:6px; background:#F4F4F2; border:1px solid var(--line); }
    .hint { font-size:11px; color:var(--sub); margin-top:4px; line-height:1.5; }
    .form-hint { background:#F5F7F9; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12px; color:var(--sub); line-height:1.7; margin-bottom:8px; }
    .form-hint b { color:var(--warn); font-weight:700; }
    .geo-row { display:flex; gap:8px; margin:2px 0 8px; }
    .geo-row input { flex:1; }
    .geo-res { margin:0 0 4px; }
    .geo-item { display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; background:#F5F7F9; border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:6px; }
    .geo-item:hover { border-color:var(--ink); background:#EFF2F4; }
    .geo-nm { font-size:13px; font-weight:600; color:var(--text); }
    .geo-sub { font-size:11px; color:var(--sub); line-height:1.5; }
    .geo-loading, .geo-empty { font-size:12px; color:var(--sub); padding:6px 2px 10px; }
    .geo-picked { font-size:12px; color:var(--success); background:#E7F5EE; border-radius:8px; padding:8px 10px; margin-bottom:4px; }
    .cp-hint { font-size:11px; color:var(--warn); margin-top:3px; line-height:1.4; }
    .tag.bad { background:#FBECEC; color:var(--danger); }

    /* ---------- 布局 ---------- */
    #app { display:none; }
    .shell { display:flex; min-height:100vh; }
    .sidebar { width:var(--nav-w); background:var(--card); border-right:1px solid var(--line); padding:18px 14px; position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
    .sidebar .brand { display:flex; align-items:center; gap:9px; padding:2px 8px 16px; }
    .sidebar .brand svg { height:22px; width:auto; flex-shrink:0; }
    .sidebar .brand-name { font-size:15px; font-weight:700; letter-spacing:.02em; }
    .nav-group { font-size:11px; color:var(--sub); font-weight:600; letter-spacing:.08em; padding:14px 10px 4px; }
    .nav-item { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:10px; font-size:13.5px; font-weight:500; color:var(--text); cursor:pointer; border:none; background:transparent; text-align:left; width:100%; }
    .nav-item:hover { background:#F0F1F3; }
    .nav-item.active { background:var(--ink); color:#fff; }
    .nav-item .ico { font-size:15px; width:20px; text-align:center; }
    .side-foot { margin-top:auto; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
    .side-foot .who { font-size:12px; color:var(--sub); padding:0 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .side-foot .btns { display:flex; gap:8px; }
    .side-foot .btns button { flex:1; }

    .main { flex:1; padding:22px 28px 60px; max-width:1280px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .toolbar h2 { font-size:19px; font-weight:700; }
    .toolbar .tools { display:flex; gap:8px; align-items:center; }
    .toolbar input[type=search] { width:200px; }

    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:11px 13px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
    th { color:var(--sub); font-weight:600; white-space:nowrap; background:#FAFAF9; font-size:12px; }
    thead th:first-child { border-top-left-radius:14px; }
    thead th:last-child { border-top-right-radius:14px; }
    tbody tr:hover { background:#F7F7F6; }
    tbody tr:last-child td:first-child { border-bottom-left-radius:14px; }
    tbody tr:last-child td:last-child { border-bottom-right-radius:14px; }
    td img { width:44px; height:44px; object-fit:cover; border-radius:9px; border:1px solid var(--line); }
    .tag { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; }
    .tag.on { background:#E7F5EE; color:var(--success); }
    .tag.off { background:#F0F1F3; color:var(--sub); }
    .tag.warn { background:#FDF3E3; color:var(--warn); }
    .row-actions { display:flex; gap:6px; }
    .empty { text-align:center; color:var(--sub); padding:52px 0; }
    .pager { display:flex; gap:6px; justify-content:flex-end; align-items:center; margin-top:14px; font-size:13px; color:var(--sub); }
    .pager button { padding:5px 11px; }

    /* ---------- 仪表盘 ---------- */
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:14px; margin-bottom:20px; }
    .stat-card { padding:16px 18px; }
    .stat-card .num { font-size:26px; font-weight:800; letter-spacing:.01em; }
    .stat-card .lbl { font-size:12px; color:var(--sub); margin-top:4px; font-weight:500; }
    .stat-card .extra { font-size:11px; color:#B6BEC9; margin-top:2px; }
    .dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:980px) { .dash-grid { grid-template-columns:1fr; } }
    .panel { padding:18px 20px; }
    .panel h3 { font-size:15px; font-weight:700; margin-bottom:14px; }
    .bars { display:flex; align-items:flex-end; gap:10px; height:150px; padding-top:6px; }
    .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
    .bar { width:100%; max-width:44px; background:var(--ink); border-radius:7px 7px 3px 3px; min-height:3px; transition:height .5s cubic-bezier(.2,.8,.2,1); }
    .bar-cnt { font-size:11px; font-weight:700; }
    .bar-day { font-size:11px; color:var(--sub); }
    .rank-row { display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:13px; }
    .rank-row:last-child { border-bottom:none; }
    .rank-idx { width:22px; height:22px; border-radius:7px; background:#F0F1F3; color:var(--sub); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
    .rank-row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rank-row .cnt { color:var(--sub); font-size:12px; }
    .notice { background:#FDF6EC; border:1px solid #F0DFC0; color:#8A6116; font-size:12.5px; padding:10px 14px; border-radius:10px; margin-bottom:16px; line-height:1.6; }

    /* ---------- 日志 ---------- */
    .filters { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
    .filters select { width:auto; min-width:130px; }
    .readonly-badge { display:inline-flex; align-items:center; gap:5px; background:#EFF3F8; color:#3B5B8C; border:1px solid #D6E0EC; font-size:12px; padding:5px 11px; border-radius:20px; font-weight:600; }

    /* ---------- 管理员 ---------- */
    .admins-card { padding:20px 22px; max-width:640px; }
    .admin-row { display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); }
    .admin-row:last-child { border-bottom:none; }
    .admin-ava { width:34px; height:34px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
    .admin-meta { flex:1; min-width:0; }
    .admin-meta .em { font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .admin-meta .sub { font-size:11.5px; color:var(--sub); }
    .add-admin { display:flex; gap:8px; margin-top:18px; }
    .add-admin input { flex:1; }

    /* ---------- toast ---------- */
    #toast { position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-80px); z-index:99; background:#1C1D1F; color:#fff; font-size:13.5px; padding:10px 20px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.18); transition:transform .3s ease; max-width:82vw; }
    #toast.show { transform:translateX(-50%) translateY(0); }
    #toast.ok { background:#176B4B; }
    #toast.bad { background:#A93636; }
  </style>
</head>
<body>
  <!-- 法务页面(?page=privacy / ?page=terms),与 legal/ 下 HTML 内容保持一致 -->
  <div id="legal" style="display:none"></div>
  <script>
    window.LEGAL_PAGE = (function () {
      var p = new URLSearchParams(location.search).get('page');
      return (p === 'privacy' || p === 'terms') ? p : '';
    })();
    if (window.LEGAL_PAGE) {
      document.documentElement.className = 'legal-page';
      var LEGAL_CONTENT = {
        privacy: `
          <h1>WELL WAY 隐私政策</h1>
          <p class="meta">版本：v2.3　生效日期：2026-11-14</p>
          <p>欢迎使用 WELL WAY（以下简称"本应用"）。我们深知个人信息对您的重要性，将尽全力保护您的个人信息安全。本政策说明我们如何收集、使用、存储与共享您的信息。您注册、登录或使用本应用，即视为已阅读并同意本政策。</p>
          <h2>一、我们收集的信息</h2>
          <ul>
            <li><b>账号信息</b>：您可匿名使用本应用；若您选择绑定邮箱，我们会保存您的邮箱地址，用于换设备恢复数据与账号安全。</li>
            <li><b>位置信息</b>：仅在您主动开始骑行并选择"WELL WAY 骑行模式"时，在骑行过程中记录位置以生成骑行轨迹、里程与打卡数据。骑行结束后不再持续获取位置。您可随时在系统设置中关闭定位权限。</li>
            <li><b>车辆信息</b>：您自行录入的车辆品牌、车型、昵称、颜色与照片，用于车库展示与骑行关联。<b>我们不收集车牌号</b>。</li>
            <li><b>骑行数据</b>：骑行轨迹、里程、时长、打卡点、徽章与路线收藏，用于记录与成就功能。</li>
            <li><b>事故现场记录</b>：仅当您主动提交时，保存事故类型、经过、时间、路线名称、当时的真实坐标与应用版本，用于本人留存及客服 / 运营只读核对。<b>该功能不用于救援调度，不会自动报警或通知任何第三方</b>；无定位时也可提交，此时不保存坐标。</li>
            <li><b>设备与网络信息</b>：为保障功能正常运行，应用会读取必要的设备信息（如系统版本）与网络状态。</li>
          </ul>
          <h2>二、我们如何使用信息</h2>
          <ul>
            <li>提供骑行路线、轨迹记录、打卡徽章、同路提示、车辆管理等功能；</li>
            <li>保障账号安全与数据同步；</li>
            <li>改进产品体验（仅使用脱敏后的统计信息）。</li>
          </ul>
          <p>我们不会将您的个人信息出售给任何第三方，不会用于个性化广告。</p>
          <h2>三、信息存储与跨境传输</h2>
          <p>数据托管于云服务商 Supabase（位于国际标准数据中心），可能传输并存储于境外服务器。传输过程采用 HTTPS 加密，并采取访问控制（RLS）、身份认证等安全措施。继续使用本应用即视为您同意上述跨境存储。</p>
          <h2>四、第三方共享</h2>
          <p>为提供服务，我们仅与以下第三方共享必要信息：</p>
          <ul>
            <li><b>云服务商 Supabase</b>：账号、骑行、车辆等数据存储与同步；</li>
            <li><b>天气服务商 和风天气（QWeather）</b>：仅在展示天气时发送查询地点的经纬度，用于获取实时天气、逐小时预报与气象预警（不发送账号、邮箱等身份信息）。</li>
            <li><b>天气服务商 Open-Meteo</b>：和风不可用时的天气备用来源；空气质量与路线海拔也由该服务提供。仅在上述场景发送查询地点（或路线采样点）的经纬度，不发送账号、邮箱等身份信息。</li>
            <li><b>地图应用</b>：当您选择跳转高德地图或苹果地图导航时，将把路线终点名称或坐标传递给对应地图应用（仅本次跳转使用，不存储于我方服务器）。</li>
          </ul>
          <p>除上述情形及法律法规要求外，我们不会向任何第三方提供您的个人信息。</p>
          <h2>五、权限说明</h2>
          <ul>
            <li><b>定位（使用期间/后台）</b>：骑行轨迹记录必需；未骑行时不获取。</li>
            <li><b>通知</b>：用于同路提示与打卡完成提醒。</li>
            <li><b>相册</b>：仅用于您主动选择头像、车辆照片，或通过系统分享面板保存骑行分享卡。</li>
          </ul>
          <p>我们仅在功能直接相关时请求权限，您可拒绝或随时在系统设置中关闭。当前版本不请求蓝牙或本地网络权限。</p>
          <h2>六、注销与删除</h2>
          <p>您可随时在应用内「我的 → 注销账号」永久删除您的账号及全部数据（包括骑行记录、徽章、车辆、收藏与事故现场记录等），删除后不可恢复。您也可通过下方联系方式联系我们协助处理数据删除、导出或更正。</p>
          <h2>七、未成年人保护</h2>
          <p>本应用面向成年摩托车爱好者。若您未满 18 周岁，请在监护人指导下使用。</p>
          <h2>八、政策更新</h2>
          <p>我们可能适时更新本政策，更新后会通过本页面或应用内公告发布，重大变更会显著提示。</p>
          <h2>九、联系我们</h2>
          <p>应用内路径：我的 → 设置 → 关于与反馈</p>
          <p>联系邮箱：<a href="mailto:contact@wellway.app">contact@wellway.app</a>（请替换为您的真实邮箱）</p>`,
        terms: `
          <h1>WELL WAY 用户协议</h1>
          <p class="meta">版本：v2.0　生效日期：2026-08-25</p>
          <p>欢迎使用 WELL WAY（以下简称"本应用"或"我们"）。本协议是您与本应用运营方之间就使用本应用服务订立的协议。您注册、登录或使用本应用，即视为已阅读并同意本协议全部条款。</p>
          <h2>一、服务内容</h2>

          <h2>二、账号与行为规范</h2>
          <ul>
            <li>您应对账号下的所有行为负责，不得转借、出租或出售账号。</li>
            <li>您承诺不利用本应用从事任何违法违规活动，包括但不限于发布违法信息、骚扰他人、侵犯他人隐私或知识产权、干扰服务正常运行。</li>
            <li>我们有权对违反本协议或法律法规的账号采取警告、限制功能、封禁等处理。</li>
          </ul>
          <h2>三、骑行安全</h2>
          <p>骑行活动存在固有风险。您应自行确认具备相应驾驶资质，遵守《道路交通安全法》等法律法规，佩戴安全装备，并在确保安全的前提下使用本应用。请勿在骑行过程中操作手机或阅读弹窗。</p>

    async function loadCheckpointSummary() {
      const { data } = await supabase.from('checkpoints').select('id, route_id, seq, name, lat, lng');
      const map = {};
      for (const cp of data || []) {
        if (!map[cp.route_id]) map[cp.route_id] = { count: 0, start: null, end: null };
        const g = map[cp.route_id];
        g.count++;
        if (cp.lat != null && cp.lng != null) {

    async function svgToHighResPng(file) {
      const text = await file.text();
      const size = parseSvgSize(text, 800);
      const scale = Math.max(1, Math.ceil(4096 / Math.max(size.w, size.h)));
      const blob = new Blob([text], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error('无法解析该 SVG'));
        img.src = url;
      });
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(size.w * scale));
      canvas.height = Math.max(1, Math.round(size.h * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      const probe = document.createElement('canvas');
      probe.width = 64;
      probe.height = 64;
      const pctx = probe.getContext('2d', { willReadFrequently: true });
      pctx.drawImage(canvas, 0, 0, 64, 64);
      const pd = pctx.getImageData(0, 0, 64, 64).data;
      const r0 = pd[0], g0 = pd[1], b0 = pd[2], a0 = pd[3];
      let blank = true;
      for (let i = 4; i < pd.length; i += 4) {
        if (Math.abs(pd[i] - r0) > 24 || Math.abs(pd[i + 1] - g0) > 24 ||
            Math.abs(pd[i + 2] - b0) > 24 || Math.abs(pd[i + 3] - a0) > 24) {
          blank = false;
          break;
        }
      }
      if (blank) throw new Error('转换结果全白/全透明(SVG 内没有可见内容),请检查源文件');
      return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
    }

    function parseSvgSize(text, fallback) {
      const m = /<svg[^>]*\swidth="([\d.]+)(?:px)?"[^>]*\sheight="([\d.]+)(?:px)?"/.exec(text)
        || /<svg[^>]*\sheight="([\d.]+)(?:px)?"[^>]*\swidth="([\d.]+)(?:px)?"/.exec(text);
      if (m && m[1] && m[2]) return { w: parseFloat(m[1]), h: parseFloat(m[2]) };
      const vb = /<svg[^>]*\sviewBox="([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)"/.exec(text);
      if (vb) {
        const w = parseFloat(vb[3]), h = parseFloat(vb[4]);
        if (w > 0 && h > 0) return { w, h };
      }
      const mm = /<svg[^>]*\swidth="([\d.]+)(mm|cm|pt|in)"[^>]*\sheight="([\d.]+)(mm|cm|pt|in)"/.exec(text)
        || /<svg[^>]*\sheight="([\d.]+)(mm|cm|pt|in)"[^>]*\swidth="([\d.]+)(mm|cm|pt|in)"/.exec(text);
      if (mm && mm[1] && mm[3]) {
        const ratio = { mm: 96 / 25.4, cm: 96 / 2.54, pt: 96 / 72, in: 96 };
        return { w: parseFloat(mm[1]) * ratio[mm[2]], h: parseFloat(mm[3]) * ratio[mm[4]] };
      }
      return { w: fallback, h: fallback };
    }

        if (c.type === 'bool') { payload[c.k] = el.checked; continue; }
        let v = el.value.trim();
        if (c.type === 'select' && c.ref) {
          v = Number(v);
          if (!v && c.optional) v = null;
          if (c.req && !v) { toast('请选择「' + c.l + '」', 'bad'); return; }
          payload[c.k] = v;
          continue;
        }
        if (c.type === 'select') {
          if (v === '') {
            if (c.req) { toast('请选择「' + c.l + '」', 'bad'); return; }
            delete payload[c.k];
            continue;
          }
          payload[c.k] = v;
          continue;

        if (c.type === 'number') {

            continue;

          v = new Date(v).toISOString();

        if (c.req && (v === '' || v === null || v === undefined)) { toast('请填写「' + c.l + '」', 'bad'); return; }
        payload[c.k] = v;

    let logState = { table: '', action: '', page: 1 };

    async function loadLogs() {
      document.getElementById('tools').innerHTML = '<span class="readonly-badge">🔒 只读 · 由数据库触发器自动记录,不可修改/删除</span>';
      let query = supabase.from('admin_logs').select('*', { count: 'exact' }).order('created_at', { ascending: false });
      if (logState.table) query = query.eq('table_name', logState.table);
      if (logState.action) query = query.eq('action', logState.action);
      query = query.range((logState.page - 1) * PAGE_SIZE, logState.page * PAGE_SIZE - 1);
      const { data, error, count } = await query;
      const view = document.getElementById('view');
      if (error) { view.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
      const filterHtml = `<div class="filters">
        <select onchange="logFilterTable(this.value)">
          <option value="">全部内容表</option>
          ${Object.entries(LOG_TABLE_LABELS).map(([k, l]) => `<option value="${k}" ${logState.table === k ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        <select onchange="logFilterAction(this.value)">
          <option value="">全部动作</option>
          <option value="INSERT" ${logState.action === 'INSERT' ? 'selected' : ''}>新增</option>
          <option value="UPDATE" ${logState.action === 'UPDATE' ? 'selected' : ''}>修改</option>
          <option value="DELETE" ${logState.action === 'DELETE' ? 'selected' : ''}>删除</option>
        </select>
      </div>`;
      const rows = (data || []).map(logRow).join('')
        || `<tr><td colspan="6"><div class="empty">还没有操作记录</div></td></tr>`;
      const pages = Math.max(1, Math.ceil((count || 0) / PAGE_SIZE));
      view.innerHTML = filterHtml + `<div class="card" style="overflow-x:auto"><table><thead><tr>
        <th>时间</th><th>操作人</th><th>内容表</th><th>动作</th><th>记录 ID</th><th>变更摘要</th>
      </tr></thead><tbody>${rows}</tbody></table></div>
      <div class="pager">
        <span>共 ${count || 0} 条</span>
        <button class="btn-ghost btn-sm" ${logState.page <= 1 ? 'disabled' : ''} onclick="logGoPage(${logState.page - 1})">上一页</button>
        <span>${logState.page} / ${pages}</span>
        <button class="btn-ghost btn-sm" ${logState.page >= pages ? 'disabled' : ''} onclick="logGoPage(${logState.page + 1})">下一页</button>
      </div>`;
    }
    window.logFilterTable = (v) => { logState.table = v; logState.page = 1; loadLogs(); };
    window.logFilterAction = (v) => { logState.action = v; logState.page = 1; loadLogs(); };
    window.logGoPage = (p) => { logState.page = p; loadLogs(); };

    function logRow(r) {
      const actionTag = r.action === 'INSERT' ? '<span class="tag on">新增</span>'
        : r.action === 'DELETE' ? '<span class="tag off">删除</span>'
        : '<span class="tag warn">修改</span>';
      const t = new Date(r.created_at).toLocaleString('zh-CN', { hour12: false });
      const table = LOG_TABLE_LABELS[r.table_name] || r.table_name;
      let summary = '';
      if (r.action === 'INSERT') summary = summarizeData(r.new_data);
      else if (r.action === 'DELETE') summary = '删除:' + summarizeData(r.old_data);
      else summary = summarizeDiff(r.old_data, r.new_data);
      return `<tr><td style="white-space:nowrap">${esc(t)}</td><td>${esc(r.actor_email || '—')}</td>
        <td>${esc(table)}</td><td>${actionTag}</td><td>${esc(r.row_id || '—')}</td>
        <td style="max-width:420px;color:var(--sub)">${summary}</td></tr>`;
    }
    function summarizeData(d) {
      if (!d || typeof d !== 'object') return '—';
      return Object.entries(d).filter(([k]) => k !== 'id').map(([k, v]) =>
        `${k}=${esc(shortVal(v))}`).join(', ').slice(0, 220) || '—';
    }
    function summarizeDiff(oldD, newD) {
      if (!oldD || !newD) return '—';
      const parts = [];
      for (const k of Object.keys(newD)) {
        if (k === 'id') continue;
        const o = oldD[k], n = newD[k];
        if (JSON.stringify(o) !== JSON.stringify(n)) {
          parts.push(`${k}: ${esc(shortVal(o))} → ${esc(shortVal(n))}`);
        }
      }
      return parts.join(', ').slice(0, 220) || '—';
    }

    // ============ 用户反馈(只读) ============
    let fbState = { q: '', page: 1 };
    let fbEmailMap = {};

    async function loadFeedback() {
      document.getElementById('tools').innerHTML = `
        <input type="search" id="fbSearch" placeholder="搜索内容/联系方式…" value="${esc(fbState.q)}" oninput="fbSearch(this.value)">
        <button class="btn-ghost btn-sm" onclick="loadFeedback()">刷新</button>`;
      const view = document.getElementById('view');
      const { data: users } = await supabase.rpc('admin_list');
      if (users) fbEmailMap = Object.fromEntries(users.map(u => [u.id, u.email]));
      let query = supabase.from('feedback').select('*', { count: 'exact' }).order('created_at', { ascending: false });
      if (fbState.q) {
        const q = fbState.q.replace(/[%,()']/g, '');
        query = query.or(`content.ilike.%${q}%,contact.ilike.%${q}%,app_version.ilike.%${q}%`);
      }
      query = query.range((fbState.page - 1) * PAGE_SIZE, fbState.page * PAGE_SIZE - 1);
      const { data, error, count } = await query;
      if (error) { view.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
      const rows = (data || []).map(fb => {
        const email = fb.user_id ? (fbEmailMap[fb.user_id] || '') : '';
        const userTxt = email ? esc(email)
          : (fb.user_id ? `<span style="color:#B6BEC9">${String(fb.user_id).slice(0, 8)}…</span>`
            : '<span class="tag off">匿名</span>');
        return `<tr>
          <td style="white-space:nowrap">${new Date(fb.created_at).toLocaleString('zh-CN', { hour12: false })}</td>
          <td>${userTxt}</td>
          <td style="max-width:420px">${esc(fb.content)}</td>
          <td>${esc(fb.contact || '—')}</td>
          <td>${esc(fb.app_version || '—')}</td>
        </tr>`;
      }).join('') || `<tr><td colspan="5"><div class="empty">还没有用户反馈</div></td></tr>`;
      const pages = Math.max(1, Math.ceil((count || 0) / PAGE_SIZE));
      view.innerHTML = `<div class="filters"><span class="readonly-badge">🔒 只读 · 用户提交的意见反馈与品牌添加请求，不可修改/删除</span></div>
        <div class="card" style="overflow-x:auto"><table><thead><tr>
          <th>时间</th><th>用户</th><th>内容</th><th>联系方式</th><th>版本</th>
        </tr></thead><tbody>${rows}</tbody></table></div>
        <div class="pager">
          <span>共 ${count || 0} 条</span>
          <button class="btn-ghost btn-sm" ${fbState.page <= 1 ? 'disabled' : ''} onclick="fbGoPage(${fbState.page - 1})">上一页</button>
          <span>${fbState.page} / ${pages}</span>
          <button class="btn-ghost btn-sm" ${fbState.page >= pages ? 'disabled' : ''} onclick="fbGoPage(${fbState.page + 1})">下一页</button>
        </div>`;
    }
    window.fbSearch = (v) => { fbState.q = v.trim(); fbState.page = 1; loadFeedback(); };
    window.fbGoPage = (p) => { fbState.page = p; loadFeedback(); };

    // ============ 事故现场记录(只读) ============
    const INCIDENT_LABELS = { fall: '摔车', collision: '碰撞', breakdown: '车辆故障', other: '其他' };
    let irState = { q: '', page: 1 };
    let irEmailMap = {};

    async function loadIncidents() {
      document.getElementById('tools').innerHTML = `
        <input type="search" id="irSearch" placeholder="搜索路线/经过/版本…" value="${esc(irState.q)}" oninput="irSearch(this.value)">
        <button class="btn-ghost btn-sm" onclick="loadIncidents()">刷新</button>`;
      const view = document.getElementById('view');
      const { data: users } = await supabase.rpc('admin_list');
      if (users) irEmailMap = Object.fromEntries(users.map(u => [u.id, u.email]));
      let query = supabase.from('incident_reports').select('*', { count: 'exact' }).order('occurred_at', { ascending: false });
      if (irState.q) {
        const q = irState.q.replace(/[%,()']/g, '');
        query = query.or(`route_name.ilike.%${q}%,note.ilike.%${q}%,app_version.ilike.%${q}%`);
      }
      query = query.range((irState.page - 1) * PAGE_SIZE, irState.page * PAGE_SIZE - 1);
      const { data, error, count } = await query;
      if (error) {
        const hint = error.code === 'PGRST205'
          ? `<br>请先在 Supabase SQL Editor 执行 <code>backend/supabase/migrations/0026_incident_reports.sql</code>`
          : '';
        view.innerHTML = `<div class="empty">${esc(error.message)}${hint}</div>`;
        return;
      }
      const rows = (data || []).map(r => {
        const email = r.user_id ? (irEmailMap[r.user_id] || '') : '';
        const userTxt = email ? esc(email)
          : (r.user_id ? `<span style="color:#B6BEC9">${String(r.user_id).slice(0, 8)}…</span>`
            : '<span class="tag off">未知</span>');
        const loc = (r.latitude != null && r.longitude != null)
          ? `<a href="https://maps.apple.com/?ll=${r.latitude},${r.longitude}&q=${r.latitude},${r.longitude}" target="_blank" rel="noopener">${Number(r.latitude).toFixed(5)}, ${Number(r.longitude).toFixed(5)}</a>`
          : '<span class="tag off">无定位</span>';
        return `<tr>
          <td style="white-space:nowrap">${new Date(r.occurred_at).toLocaleString('zh-CN', { hour12: false })}</td>
          <td>${userTxt}</td>
          <td>${esc(INCIDENT_LABELS[r.incident_type] || r.incident_type)}</td>
          <td>${esc(r.route_name || '—')}</td>
          <td style="white-space:nowrap">${loc}</td>
          <td style="max-width:360px">${esc(r.note || '—')}</td>
          <td>${esc(r.app_version || '—')}</td>
        </tr>`;
      }).join('') || `<tr><td colspan="7"><div class="empty">还没有事故记录</div></td></tr>`;
      const pages = Math.max(1, Math.ceil((count || 0) / PAGE_SIZE));
      view.innerHTML = `<div class="filters"><span class="readonly-badge">🔒 只读 · 用户主动提交的事故现场记录；仅用于留存与客服核对，不触发报警或救援调度，不可修改/删除</span></div>
        <div class="card" style="overflow-x:auto"><table><thead><tr>
          <th>时间</th><th>用户</th><th>类型</th><th>路线</th><th>位置</th><th>经过</th><th>版本</th>
        </tr></thead><tbody>${rows}</tbody></table></div>
        <div class="pager">
          <span>共 ${count || 0} 条</span>
          <button class="btn-ghost btn-sm" ${irState.page <= 1 ? 'disabled' : ''} onclick="irGoPage(${irState.page - 1})">上一页</button>
          <span>${irState.page} / ${pages}</span>
          <button class="btn-ghost btn-sm" ${irState.page >= pages ? 'disabled' : ''} onclick="irGoPage(${irState.page + 1})">下一页</button>
        </div>`;
    }
    window.irSearch = (v) => { irState.q = v.trim(); irState.page = 1; loadIncidents(); };
    window.irGoPage = (p) => { irState.page = p; loadIncidents(); };

    // ============ 管理员管理 ============
    async function loadAdmins() {
      document.getElementById('tools').innerHTML = '<button class="btn-ghost btn-sm" onclick="loadAdmins()">刷新</button>';
      const view = document.getElementById('view');
      const { data, error } = await supabase.rpc('admin_list');
      if (error) {
        view.innerHTML = `<div class="notice">⚠️ 管理员管理暂不可用（${esc(error.message)}）。<br>请先执行 <code>backend/supabase/migrations/0013_admin_dashboard.sql</code></div>`;
        return;
      }
      const me = (await supabase.auth.getUser()).data.user;
      const rows = (data || []).map(a => {
        const initial = (a.email || '?')[0].toUpperCase();
        const isMe = me && a.id === me.id;
        return `<div class="admin-row">
          <div class="admin-ava">${initial}</div>
          <div class="admin-meta">
            <div class="em">${esc(a.email)} ${isMe ? '<span class="tag on">我</span>' : ''} <span class="tag ${a.is_admin ? 'on' : 'off'}">${a.is_admin ? '管理员' : '普通用户'}</span></div>
            <div class="sub">${a.nickname || '—'} · 加入于 ${new Date(a.created_at).toLocaleDateString('zh-CN')}</div>
          </div>
          ${!a.is_admin ? '' : (isMe || String(a.email).toLowerCase() === '421975135@qq.com' ? '' : `<button class="btn-danger btn-sm" onclick="revokeAdmin('${esc(a.email)}')">移除</button>`)}
        </div>`;
      }).join('') || '<div class="empty">暂无用户</div>';
      view.innerHTML = `<div class="admins-card card">
        <h3>管理员列表</h3>
        ${rows}
        <div class="add-admin">
          <input id="newAdminEmail" type="email" placeholder="输入邮箱，授予管理员权限">
          <button class="btn-primary btn-sm" onclick="grantAdmin()">授予</button>
        </div>
      </div>`;
    }
    window.grantAdmin = async () => {
      const email = document.getElementById('newAdminEmail').value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('请输入有效邮箱', 'bad'); return; }
      const { data, error } = await supabase.rpc('admin_grant', { p_email: email });
      if (error) { toast('授予失败: ' + error.message, 'bad'); return; }
      toast('已授予管理员: ' + email, 'ok');
      document.getElementById('newAdminEmail').value = '';
      loadAdmins();
    };
    window.revokeAdmin = async (email) => {
      if (!confirm('确认移除管理员 ' + email + '?')) return;
      const { data, error } = await supabase.rpc('admin_revoke', { p_email: email });
      if (error) { toast('移除失败: ' + error.message, 'bad'); return; }
      toast('已移除: ' + email, 'ok');
      loadAdmins();
    };

    // ============ 启动 ============
    async function checkAdmin() {
      const { data: { user } } = await supabase.auth.getUser();
      const { data: profile } = await supabase.from('profiles')
        .select('nickname, is_admin').eq('id', user.id).maybeSingle();
      if (!profile?.is_admin) {
        document.getElementById('whoami').textContent = user.email || user.id;
        alert('该账号不是管理员。请先在 Supabase SQL Editor 执行:\nupdate profiles set is_admin = true where id = \'' + user.id + '\';');
        await supabase.auth.signOut();
        location.reload();
        return;
      }
      document.getElementById('login').style.display = 'none';
      document.getElementById('resetpw').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('whoami').textContent = (profile.nickname || '管理员') + ' · ' + (user.email || '');
      renderNav();
      await loadRefs();
      // 概览只显示数据监测 + 日志, 管理员入口放侧栏
      await switchView('dashboard');
    }

    async function loadRefs() {
      for (const [key, t] of Object.entries(TABLES)) {
        if (t.cols.some(c => c.ref)) {
          const { data } = await supabase.from(key).select('*');
          refCache[key] = data || [];
        }
      }
    }

    if (!window.LEGAL_PAGE) {
      supabase.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') {
          document.getElementById('login').style.display = 'none';
          document.getElementById('app').style.display = 'none';
          document.getElementById('resetpw').style.display = 'block';
        }
      });
      const { data: { session } } = await supabase.auth.getSession();
      if (session) { await checkAdmin(); }
    }
  </script>
</body>
</html>
