<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WELL WAY 管理后台</title>
  <style>
    :root { --ink:#111; --bg:#F4F4F2; --card:#fff; --text:#17181A; --sub:#8A8F98; --line:#E9EAEC; --danger:#D84040; --success:#1E8A5A; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,"PingFang SC",sans-serif; background:var(--bg); color:var(--text); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 1px 3px rgba(17,17,17,.04); }
    input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:#fff; color:var(--text); outline:none; transition:border-color .15s; }
    input:focus, select:focus, textarea:focus { border-color:var(--ink); }
    label { font-size:12px; color:var(--sub); display:block; margin:12px 0 5px; letter-spacing:.02em; }
    button { cursor:pointer; border:none; border-radius:10px; font-size:14px; padding:9px 16px; font-weight:600; transition:all .15s; }
    .btn-primary { background:var(--ink); color:#fff; }
    .btn-primary:hover { background:#333; }
    .btn-ghost { background:#F0F1F3; color:var(--text); }
    .btn-ghost:hover { background:#E4E6E9; }
    .btn-danger { background:#FBECEC; color:var(--danger); }
    .btn-danger:hover { background:#F7DCDC; }
    /* login */
    #login { max-width:400px; margin:14vh auto; padding:40px 36px; }
    #login .brand { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    #login .brand svg { height:26px; width:auto; }
    #login h1 { font-size:24px; letter-spacing:.01em; }
    #login p { color:var(--sub); font-size:13px; margin:8px 0 22px; }
    .err { color:var(--danger); font-size:13px; margin-top:10px; min-height:18px; }
    /* layout */
    #app { display:none; }
    header { background:var(--card); padding:13px 24px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
    header .brand { display:flex; align-items:center; gap:9px; flex:1; }
    header .brand svg { height:22px; width:auto; }
    header .brand-name { font-size:17px; font-weight:700; letter-spacing:.02em; }
    header .brand-sub { font-size:11px; color:var(--sub); font-weight:500; padding:3px 8px; border:1px solid var(--line); border-radius:20px; }
    .tabs { display:flex; gap:6px; padding:18px 24px 0; overflow-x:auto; }
    .tabs button { white-space:nowrap; background:transparent; color:var(--sub); font-weight:500; padding:8px 16px; border-radius:10px; }
    .tabs button:hover { background:#ECEDEF; color:var(--text); }
    .tabs .active { background:var(--ink); color:#fff; }
    .tabs .active:hover { background:var(--ink); color:#fff; }
    main { padding:18px 24px 48px; max-width:1440px; margin:0 auto; width:100%; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .toolbar h2 { font-size:18px; font-weight:700; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:12px 14px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
    th { color:var(--sub); font-weight:600; white-space:nowrap; background:#FAFAF9; font-size:12px; }
    thead th:first-child { border-top-left-radius:15px; }
    thead th:last-child { border-top-right-radius:15px; }
    tbody tr:hover { background:#F7F7F6; }
    tbody tr:last-child td:first-child { border-bottom-left-radius:15px; }
    tbody tr:last-child td:last-child { border-bottom-right-radius:15px; }
    td img { width:46px; height:46px; object-fit:cover; border-radius:10px; border:1px solid var(--line); }
    .tag { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
    .tag.on { background:#E7F5EE; color:var(--success); }
    .tag.off { background:#F0F1F3; color:var(--sub); }
    .row-actions { display:flex; gap:6px; }
    .row-actions button { padding:6px 12px; font-size:12px; border-radius:8px; }
    .empty { text-align:center; color:var(--sub); padding:56px 0; }
    /* modal */
    #modal { display:none; position:fixed; inset:0; background:rgba(17,17,17,.4); z-index:10; overflow-y:auto; }
    #modal .box { max-width:540px; margin:6vh auto; padding:26px; }
    #modal h3 { font-size:17px; margin-bottom:16px; font-weight:700; }
    #modal .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:22px; }
    #pwmodal, #forgotmodal { display:none; position:fixed; inset:0; background:rgba(17,17,17,.4); z-index:11; overflow-y:auto; }
    #pwmodal .box, #forgotmodal .box { max-width:420px; margin:18vh auto; padding:26px; }
    #pwmodal h3, #forgotmodal h3 { font-size:17px; margin-bottom:16px; font-weight:700; }
    #pwmodal .actions, #forgotmodal .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:22px; }
    #forgot { display:inline-block; margin-top:12px; font-size:13px; color:var(--sub); cursor:pointer; text-decoration:underline; }
    #forgot:hover { color:var(--ink); }
    #resetpw { display:none; max-width:400px; margin:14vh auto; padding:40px 36px; }
    #resetpw .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:22px; }
    .chk { display:flex; align-items:center; gap:8px; margin-top:12px; }
    .chk input { width:auto; }
    .chk label { margin:0; font-size:13px; color:var(--text); }
    .imgprev { width:76px; height:76px; object-fit:cover; border-radius:12px; margin-top:8px; background:#F4F4F2; border:1px solid var(--line); }
  </style>
</head>
<body>
  <!-- 登录 -->
  <div id="login" class="card">
    <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560"><defs><style>.cls-1{fill:url(#未命名的渐变_53);}.cls-2{fill:url(#未命名的渐变_12);}</style><linearGradient id="未命名的渐变_53" x1="450.23" y1="738.62" x2="450.23" y2="230.93" gradientTransform="matrix(0.87, 0.5, -0.5, 0.87, 190.13, -421.75)" gradientUnits="userSpaceOnUse"><stop offset="0"/><stop offset="0.34" stop-color="#030303"/><stop offset="0.59" stop-color="#0c0c0c"/><stop offset="0.8" stop-color="#1b1b1b"/><stop offset="0.99" stop-color="#313131"/><stop offset="1" stop-color="#333"/></linearGradient><linearGradient id="未命名的渐变_12" x1="450" y1="739.08" x2="450" y2="457.16" gradientTransform="matrix(0.87, 0.5, -0.5, 0.87, 190.13, -421.75)" gradientUnits="userSpaceOnUse"><stop offset="0.2"/><stop offset="0.28" stop-color="#121212"/><stop offset="0.45" stop-color="#414141"/><stop offset="0.68" stop-color="#8d8d8d"/><stop offset="0.97" stop-color="#f4f4f4"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><path class="cls-1" d="M11.12,286.38,438.59,4.14c17-11.23,39.55,1.78,38.33,22.14L446.23,537.5c-1.32,22-28.51,31.42-43.16,15-46.51-52.16-122.62-133.73-163.89-157.59-41.49-24-150.81-49.34-219.46-63.66C-1.83,326.76-7.24,298.5,11.12,286.38Z"/><path class="cls-2" d="M137.7,378.36l195.71-177.3c11-9.94,28.25,0,25.13,14.51L302.87,473.65a15.24,15.24,0,0,1-27.58,5.23c-15.5-23.28-36.69-52.42-50.43-60.36S175,406.68,146.94,404.86A15.24,15.24,0,0,1,137.7,378.36Z"/></svg><span>WELL WAY</span></div>
    <h1>管理后台</h1>
    <p>用管理员邮箱登录后管理车型库、路线与内容</p>
    <label>邮箱</label><input id="email" type="email" autocomplete="username">
    <label>密码</label><input id="password" type="password" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn-primary" style="width:100%;margin-top:6px" onclick="login()">登 录</button>
    <a id="forgot" onclick="openForgotModal()">忘记密码？</a>
  </div>

  <!-- 忘记密码弹窗 -->
  <div id="forgotmodal"><div class="card box">
    <h3>重置密码</h3>
    <label>邮箱</label><input id="forgotEmail" type="email" autocomplete="email">
    <div class="err" id="forgotErr"></div>
    <div class="actions">
      <button class="btn-ghost" onclick="closeForgotModal()">取消</button>
      <button class="btn-primary" onclick="sendResetEmail()">发送重置邮件</button>
    </div>
  </div></div>

  <!-- 邮件链接跳回后的设置新密码面板 -->
  <div id="resetpw" class="card">
    <div class="brand"><span>WELL WAY</span></div>
    <h1>设置新密码</h1>
    <p>输入你的新密码，然后重新登录</p>
    <label>新密码</label><input id="rpw1" type="password" autocomplete="new-password" placeholder="至少 8 位">
    <label>确认新密码</label><input id="rpw2" type="password" autocomplete="new-password">
    <div class="err" id="rpwErr"></div>
    <div class="actions"><button class="btn-primary" style="width:100%" onclick="submitNewPassword()">保存并重新登录</button></div>
  </div>

  <!-- 后台 -->
  <div id="app">
    <header>
      <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560"><defs><style>.cls-1{fill:url(#未命名的渐变_53);}.cls-2{fill:url(#未命名的渐变_12);}</style><linearGradient id="未命名的渐变_53" x1="450.23" y1="738.62" x2="450.23" y2="230.93" gradientTransform="matrix(0.87, 0.5, -0.5, 0.87, 190.13, -421.75)" gradientUnits="userSpaceOnUse"><stop offset="0"/><stop offset="0.34" stop-color="#030303"/><stop offset="0.59" stop-color="#0c0c0c"/><stop offset="0.8" stop-color="#1b1b1b"/><stop offset="0.99" stop-color="#313131"/><stop offset="1" stop-color="#333"/></linearGradient><linearGradient id="未命名的渐变_12" x1="450" y1="739.08" x2="450" y2="457.16" gradientTransform="matrix(0.87, 0.5, -0.5, 0.87, 190.13, -421.75)" gradientUnits="userSpaceOnUse"><stop offset="0.2"/><stop offset="0.28" stop-color="#121212"/><stop offset="0.45" stop-color="#414141"/><stop offset="0.68" stop-color="#8d8d8d"/><stop offset="0.97" stop-color="#f4f4f4"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><path class="cls-1" d="M11.12,286.38,438.59,4.14c17-11.23,39.55,1.78,38.33,22.14L446.23,537.5c-1.32,22-28.51,31.42-43.16,15-46.51-52.16-122.62-133.73-163.89-157.59-41.49-24-150.81-49.34-219.46-63.66C-1.83,326.76-7.24,298.5,11.12,286.38Z"/><path class="cls-2" d="M137.7,378.36l195.71-177.3c11-9.94,28.25,0,25.13,14.51L302.87,473.65a15.24,15.24,0,0,1-27.58,5.23c-15.5-23.28-36.69-52.42-50.43-60.36S175,406.68,146.94,404.86A15.24,15.24,0,0,1,137.7,378.36Z"/></svg><span class="brand-name">WELL WAY</span><span class="brand-sub">管理后台</span></div>
      <span style="font-size:13px;color:var(--sub)" id="whoami"></span>
      <button class="btn-ghost" onclick="openPwModal()">修改密码</button>
      <button class="btn-ghost" onclick="logout()">退出</button>
    </header>
    <div class="tabs" id="tabs"></div>
    <main>
      <div class="toolbar">
        <h2 id="tabTitle"></h2>
        <button class="btn-primary" onclick="openForm()">＋ 新增</button>
      </div>
      <div class="card" style="overflow-x:auto" id="tableWrap"></div>
    </main>
  </div>

  <!-- 编辑弹窗 -->
  <div id="modal"><div class="card box" id="modalBox"></div></div>

  <!-- 修改密码弹窗 -->
  <div id="pwmodal"><div class="card box">
    <h3>修改密码</h3>
    <label>新密码</label><input id="pw1" type="password" autocomplete="new-password" placeholder="至少 8 位">
    <label>确认新密码</label><input id="pw2" type="password" autocomplete="new-password">
    <div class="err" id="pwErr"></div>
    <div class="actions">
      <button class="btn-ghost" onclick="closePwModal()">取消</button>
      <button class="btn-primary" onclick="changePassword()">保存</button>
    </div>
  </div></div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

    // ===== 配置:改成你的 Supabase 项目 =====
    const SUPABASE_URL = 'https://hyfxpcwbhfgmtwjhcxdn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_wUdbrbEFBtWcLO86nk_nwA_vRyXnfp4';

    window.supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const TABLES = {
      brands: { label: '品牌', order: 'sort', cols: [
        { k: 'name', l: '名称', req: true },
        { k: 'name_en', l: '英文名' },
        { k: 'logo_url', l: 'Logo 图片', type: 'image', bucket: 'catalog-images' },
        { k: 'is_hot', l: '热门', type: 'bool' },
        { k: 'sort', l: '排序', type: 'number', req: true },
        { k: 'is_active', l: '启用', type: 'bool' },
      ]},
      models: { label: '车型', order: 'sort', cols: [
        { k: 'brand_id', l: '品牌', type: 'select', ref: 'brands', refLabel: 'name', req: true },
        { k: 'name', l: '名称', req: true },
        { k: 'series', l: '系列' },
        { k: 'model_type', l: '类型', type: 'select', options: ['跑车','街车','ADV','复古','踏板'], req: true },
        { k: 'displacement_cc', l: '排量(cc)', type: 'number' },
        { k: 'price_min', l: '价格下限 ¥', type: 'number' },
        { k: 'price_max', l: '价格上限 ¥', type: 'number' },
        { k: 'rating', l: '评分', type: 'number', step: 0.1 },
        { k: 'image_url', l: '图片', type: 'image', bucket: 'catalog-images' },
        { k: 'is_new', l: '新款', type: 'bool' },
        { k: 'sort', l: '排序', type: 'number', req: true },
        { k: 'is_active', l: '启用', type: 'bool' },
      ]},
      routes: { label: '路线', order: 'id', cols: [
        { k: 'name', l: '名称', req: true },
        { k: 'map_url', l: '路线图', type: 'image', bucket: 'route-images', hint: 'SVG 或 ≥2048px 高清图;支持透明背景;SVG 自动转 4096px 高清 PNG,放大更清晰' },
        { k: 'start_name', l: '起点' },
        { k: 'end_name', l: '终点' },
        { k: 'distance_m', l: '里程(米)', type: 'number', req: true },
        { k: 'elevation_m', l: '爬升(米)', type: 'number', req: true },
        { k: 'difficulty', l: '难度', type: 'select', options: ['简单','中等','困难'], req: true },
        { k: 'duration_min', l: '耗时(分钟)', type: 'number' },
        { k: 'is_active', l: '启用', type: 'bool' },
      ]},
      checkpoints: { label: '打卡点', order: 'seq', cols: [
        { k: 'route_id', l: '路线', type: 'select', ref: 'routes', refLabel: 'name', req: true },
        { k: 'name', l: '名称', req: true },
        { k: 'seq', l: '序号', type: 'number', req: true },
        { k: 'lat', l: '纬度', type: 'number', step: 0.000001 },
        { k: 'lng', l: '经度', type: 'number', step: 0.000001 },
        { k: 'radius_m', l: '半径(米)', type: 'number', req: true },
      ]},
      badges: { label: '徽章', order: 'seq', cols: [
        { k: 'name', l: '名称', req: true },
        { k: 'route_id', l: '关联路线(可空)', type: 'select', ref: 'routes', refLabel: 'name', optional: true },
        { k: 'condition_desc', l: '获得条件' },
        { k: 'image_url', l: '图片', type: 'image', bucket: 'catalog-images' },
        { k: 'seq', l: '排序', type: 'number', req: true },
      ]},
      activities: { label: '活动', order: 'id', cols: [
        { k: 'name', l: '名称', req: true },
        { k: 'route_id', l: '关联路线(可空)', type: 'select', ref: 'routes', refLabel: 'name', optional: true },
        { k: 'starts_at', l: '开始时间', type: 'datetime' },
        { k: 'ends_at', l: '结束时间', type: 'datetime' },
        { k: 'reward_desc', l: '奖励说明' },
        { k: 'slots', l: '名额', type: 'number' },
        { k: 'status', l: '状态', type: 'select', options: ['upcoming','ongoing','ended'], req: true },
      ]},
    };

    let current = 'brands';
    let currentRows = [];
    const refCache = {};

    window.login = async () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const err = document.getElementById('loginErr');
      err.textContent = '';
      const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
      if (error) { err.textContent = error.message; return; }
      await checkAdmin();
    };

    window.logout = async () => {
      await supabase.auth.signOut();
      location.reload();
    };

    window.openPwModal = () => {
      document.getElementById('pw1').value = '';
      document.getElementById('pw2').value = '';
      document.getElementById('pwErr').textContent = '';
      document.getElementById('pwmodal').style.display = 'block';
      document.getElementById('pw1').focus();
    };
    window.closePwModal = () => { document.getElementById('pwmodal').style.display = 'none'; };
    window.openForgotModal = () => {
      document.getElementById('forgotEmail').value = '';
      document.getElementById('forgotErr').textContent = '';
      document.getElementById('forgotmodal').style.display = 'block';
      document.getElementById('forgotEmail').focus();
    };
    window.closeForgotModal = () => { document.getElementById('forgotmodal').style.display = 'none'; };
    window.sendResetEmail = async () => {
      const email = document.getElementById('forgotEmail').value.trim();
      const err = document.getElementById('forgotErr');
      err.textContent = '';
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = '请输入有效的邮箱'; return; }
      const redirectTo = location.origin + location.pathname;
      const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) { err.textContent = error.message; return; }
      closeForgotModal();
      alert('重置邮件已发送，请到 ' + email + ' 查收，点击邮件里的链接设置新密码');
    };
    window.submitNewPassword = async () => {
      const p1 = document.getElementById('rpw1').value;
      const p2 = document.getElementById('rpw2').value;
      const err = document.getElementById('rpwErr');
      err.textContent = '';
      if (p1.length < 8) { err.textContent = '密码至少 8 位'; return; }
      if (p1 !== p2) { err.textContent = '两次输入的密码不一致'; return; }
      const { error } = await supabase.auth.updateUser({ password: p1 });
      if (error) { err.textContent = error.message; return; }
      alert('密码已重置，请用新密码登录');
      await supabase.auth.signOut();
      location.href = location.origin + location.pathname;
    };
    window.changePassword = async () => {
      const p1 = document.getElementById('pw1').value;
      const p2 = document.getElementById('pw2').value;
      const err = document.getElementById('pwErr');
      err.textContent = '';
      if (p1.length < 8) { err.textContent = '密码至少 8 位'; return; }
      if (p1 !== p2) { err.textContent = '两次输入的密码不一致'; return; }
      const { error } = await supabase.auth.updateUser({ password: p1 });
      if (error) { err.textContent = error.message; return; }
      closePwModal();
      alert('密码已修改，请用新密码重新登录');
      await supabase.auth.signOut();
      location.reload();
    };

    async function checkAdmin() {
      const { data: { user } } = await supabase.auth.getUser();
      const { data: profile } = await supabase.from('profiles')
        .select('nickname, is_admin').eq('id', user.id).maybeSingle();
      if (!profile?.is_admin) {
        document.getElementById('whoami').textContent = user.email || user.id;
        alert('该账号不是管理员。请先在 Supabase SQL Editor 执行:\nupdate profiles set is_admin = true where id = \'' + user.id + '\';');
        await supabase.auth.signOut();
        location.reload();
        return;
      }
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('whoami').textContent = (profile.nickname || '管理员') + ' · ' + (user.email || '');
      renderTabs();
      await loadRefs();
      await loadTable();
    }

    function renderTabs() {
      const content = Object.entries(TABLES).map(([key, t]) =>
        `<button class="${key === current ? 'active' : ''}" onclick="switchTab('${key}')">${t.label}</button>`).join('');
      const logBtn = `<button class="${current === 'admin_logs' ? 'active' : ''}" onclick="switchTab('admin_logs')">操作日志</button>`;
      document.getElementById('tabs').innerHTML = content + logBtn;
    }
    window.switchTab = async (key) => { current = key; renderTabs(); await loadTable(); };

    async function loadRefs() {
      for (const [key, t] of Object.entries(TABLES)) {
        if (t.cols.some(c => c.ref)) {
          const { data } = await supabase.from(key).select('*');
          refCache[key] = data || [];
        }
      }
    }

    async function loadTable() {
      if (current === 'admin_logs') return loadLogs();
      const t = TABLES[current];
      document.getElementById('tabTitle').textContent = t.label;
      document.querySelector('.toolbar .btn-primary').style.display = '';
      const { data, error } = await supabase.from(current).select('*').order(t.order);
      if (error) { document.getElementById('tableWrap').innerHTML = `<div class="empty">${error.message}</div>`; return; }
      currentRows = data || [];
      renderTable();
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 操作日志(只读):内容表增删改由数据库触发器自动记录
    async function loadLogs() {
      document.getElementById('tabTitle').textContent = '操作日志';
      document.querySelector('.toolbar .btn-primary').style.display = 'none';
      const { data, error } = await supabase.from('admin_logs')
        .select('*').order('created_at', { ascending: false }).limit(200);
      if (error) { document.getElementById('tableWrap').innerHTML = `<div class="empty">${error.message}</div>`; return; }
      currentRows = data || [];
      const rows = currentRows.map(logRow).join('')
        || `<tr><td colspan="6"><div class="empty">还没有操作记录</div></td></tr>`;
      document.getElementById('tableWrap').innerHTML = `<table><thead><tr>
        <th>时间</th><th>操作人</th><th>内容表</th><th>动作</th><th>记录 ID</th><th>变更摘要</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
    }

    const LOG_TABLE_LABELS = { brands: '品牌', models: '车型', routes: '路线', checkpoints: '打卡点', badges: '徽章', activities: '活动' };

    function logRow(r) {
      const actionTag = r.action === 'INSERT' ? '<span class="tag on">新增</span>'
        : r.action === 'DELETE' ? '<span class="tag off">删除</span>'
        : '<span class="tag" style="background:#FDF3E3;color:#B7791F">修改</span>';
      const t = new Date(r.created_at).toLocaleString('zh-CN', { hour12: false });
      const table = LOG_TABLE_LABELS[r.table_name] || r.table_name;
      let summary = '';
      if (r.action === 'INSERT') summary = summarizeData(r.new_data);
      else if (r.action === 'DELETE') summary = '删除:' + summarizeData(r.old_data);
      else summary = summarizeDiff(r.old_data, r.new_data);
      return `<tr><td style="white-space:nowrap">${esc(t)}</td><td>${esc(r.actor_email || '—')}</td>
        <td>${esc(table)}</td><td>${actionTag}</td><td>${esc(r.row_id || '—')}</td>
        <td style="max-width:460px;color:var(--sub)">${summary}</td></tr>`;
    }

    function summarizeData(d) {
      if (!d || typeof d !== 'object') return '—';
      return Object.entries(d).filter(([k]) => k !== 'id').map(([k, v]) =>
        `${k}=${esc(shortVal(v))}`).join(', ').slice(0, 220) || '—';
    }

    function summarizeDiff(oldD, newD) {
      if (!oldD || !newD) return '—';
      const parts = [];
      for (const k of Object.keys(newD)) {
        if (k === 'id') continue;
        const o = oldD[k], n = newD[k];
        if (JSON.stringify(o) !== JSON.stringify(n)) {
          parts.push(`${k}: ${esc(shortVal(o))} → ${esc(shortVal(n))}`);
        }
      }
      return parts.join(', ').slice(0, 220) || '—';
    }

    function shortVal(v) {
      if (v === null || v === undefined) return '空';
      if (typeof v === 'boolean') return v ? '是' : '否';
      const s = String(v);
      return s.length > 18 ? s.slice(0, 18) + '…' : s;
    }

    function fmt(v) {
      if (v === null || v === undefined || v === '') return '<span style="color:#B6BEC9">—</span>';
      if (typeof v === 'boolean') return v ? '<span class="tag on">是</span>' : '<span class="tag off">否</span>';
      if (typeof v === 'string' && /^https?:\/\//.test(v)) return `<img src="${v}" onerror="this.style.display='none'">`;
      if (typeof v === 'string' && v.length > 28) return v.slice(0, 28) + '…';
      return v;
    }

    function renderTable() {
      const t = TABLES[current];
      if (!currentRows.length) {
        document.getElementById('tableWrap').innerHTML = '<div class="empty">暂无数据,点右上角"新增"添加</div>';
        return;
      }
      const keys = t.cols.map(c => c.k);
      const head = keys.map(k => `<th>${t.cols.find(c => c.k === k).l}</th>`).join('') + '<th>操作</th>';
      const rows = currentRows.map(row => {
        const tds = keys.map(k => {
          let v = row[k];
          const col = t.cols.find(c => c.k === k);
          if (col.ref) v = refCache[col.ref]?.find(r => r.id === v)?.[col.refLabel] ?? v;
          return `<td>${fmt(v)}</td>`;
        }).join('');
        return `<tr>${tds}<td><div class="row-actions">
          <button class="btn-ghost" onclick="openForm(${row.id})">编辑</button>
          <button class="btn-danger" onclick="delRow(${row.id})">删除</button></div></td></tr>`;
      }).join('');
      document.getElementById('tableWrap').innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    window.openForm = (id) => {
      const t = TABLES[current];
      const row = currentRows.find(r => r.id === id) || {};
      const fields = t.cols.map(c => {
        const val = row[c.k] ?? '';
        if (c.type === 'bool') return `<div class="chk"><input type="checkbox" id="f_${c.k}" ${val ? 'checked' : ''}><label>${c.l}</label></div>`;
        if (c.type === 'select') {
          let optHtml = (c.optional ? '<option value="">— 不关联 —</option>' : '');
          if (c.ref) {
            optHtml += (refCache[c.ref] || []).map(r =>
              `<option value="${r.id}" ${String(val) === String(r.id) ? 'selected' : ''}>${r[c.refLabel]}</option>`).join('');
          } else {
            optHtml += (c.options || []).map(o =>
              `<option value="${o}" ${String(val) === String(o) ? 'selected' : ''}>${o}</option>`).join('');
          }
          return `<label>${c.l}</label><select id="f_${c.k}">${optHtml}</select>`;
        }
        const input = c.type === 'number' ? `type="number" step="${c.step || 1}"` :
          (c.type === 'datetime' ? 'type="datetime-local"' : 'type="text"');
        let html = `<label>${c.l}</label><input ${input} id="f_${c.k}" value="${String(val ?? '').replace(/"/g, '&quot;')}">`;
        if (c.type === 'image') {
          html += val ? `<img class="imgprev" src="${val}" onerror="this.style.display='none'">` : '';
          html += `<input type="file" id="up_${c.k}" accept="image/*" style="margin-top:6px" onchange="uploadImage('${c.k}')">`;
          if (c.hint) html += `<div style="font-size:11px;color:var(--sub);margin-top:4px">${c.hint}</div>`;
        }
        return html;
      }).join('');
      document.getElementById('modalBox').innerHTML = `<h3>${id ? '编辑' : '新增'}${t.label}</h3>${fields}
        <div class="actions"><button class="btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn-primary" onclick="saveForm(${id ?? 'null'})">保存</button></div>`;
      document.getElementById('modal').style.display = 'block';
    };
    window.closeModal = () => { document.getElementById('modal').style.display = 'none'; };

    window.uploadImage = async (k) => {
      const t = TABLES[current];
      const col = t.cols.find(c => c.k === k);
      const input = document.getElementById(`up_${k}`);
      const file = input.files[0];
      if (!file) return;
      let uploadFile = file;
      let uploadName = file.name;
      // SVG 矢量图 → 高清 PNG(放大不失真,App 端可直接显示)
      if (file.type === 'image/svg+xml' || /\.svg$/i.test(file.name)) {
        try {
          uploadFile = await svgToHighResPng(file);
          uploadName = file.name.replace(/\.svg$/i, '.png');
        } catch (e) {
          alert('SVG 转换失败: ' + e.message + '\n也可直接上传高分辨率 PNG/JPG');
          input.value = '';
          return;
        }
      }
      // Supabase 存储文件名只允许 [a-zA-Z0-9_-],中文/空格等需清洗
      const safeBase = uploadName
        .replace(/\.[^.]+$/, '')
        .replace(/[^a-zA-Z0-9_-]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '') || 'route';
      const ext = (uploadName.match(/\.[^.]+$/) || ['.png'])[0].toLowerCase();
      const path = `${Date.now()}-${safeBase}${ext}`;
      const { error } = await supabase.storage.from(col.bucket).upload(path, uploadFile, { upsert: true });
      if (error) { alert('上传失败: ' + error.message); return; }
      const { data } = supabase.storage.from(col.bucket).getPublicUrl(path);
      document.getElementById(`f_${k}`).value = data.publicUrl;
      const prev = document.querySelector(`.imgprev`);
      if (prev) { prev.src = data.publicUrl; prev.style.display = ''; }
    };

    // SVG 渲染到 ≥4096px 画布导出 PNG,保证 iOS 端放大也不糊
    async function svgToHighResPng(file) {
      const text = await file.text();
      const size = parseSvgSize(text, 800);
      const scale = Math.max(1, Math.ceil(4096 / Math.max(size.w, size.h)));
      const blob = new Blob([text], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error('无法解析该 SVG'));
        img.src = url;
      });
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(size.w * scale));
      canvas.height = Math.max(1, Math.round(size.h * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      // 空白检测:缩小采样,若整幅图颜色完全一致(全白/全透明),说明 SVG 内容没渲染出来
      // (常见原因:白线+白底、图层被白底盖住、导出内容为空),提前报错而不是静默上传白图
      const probe = document.createElement('canvas');
      probe.width = 64;
      probe.height = 64;
      const pctx = probe.getContext('2d', { willReadFrequently: true });
      pctx.drawImage(canvas, 0, 0, 64, 64);
      const pd = pctx.getImageData(0, 0, 64, 64).data;
      const r0 = pd[0], g0 = pd[1], b0 = pd[2], a0 = pd[3];
      let blank = true;
      for (let i = 4; i < pd.length; i += 4) {
        if (Math.abs(pd[i] - r0) > 24 || Math.abs(pd[i + 1] - g0) > 24 ||
            Math.abs(pd[i + 2] - b0) > 24 || Math.abs(pd[i + 3] - a0) > 24) {
          blank = false;
          break;
        }
      }
      if (blank) throw new Error('转换结果全白/全透明(SVG 内没有可见内容,常见原因是白线+白底或内容被白色图层盖住),请检查源文件');
      return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
    }

    function parseSvgSize(text, fallback) {
      // 优先 width/height(px);很多设计稿导出的 SVG 只有 viewBox(如 2045x560),按 viewBox 比例
      const m = /<svg[^>]*\swidth="([\d.]+)(?:px)?"[^>]*\sheight="([\d.]+)(?:px)?"/.exec(text)
        || /<svg[^>]*\sheight="([\d.]+)(?:px)?"[^>]*\swidth="([\d.]+)(?:px)?"/.exec(text);
      if (m && m[1] && m[2]) return { w: parseFloat(m[1]), h: parseFloat(m[2]) };
      const vb = /<svg[^>]*\sviewBox="([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)"/.exec(text);
      if (vb) {
        const w = parseFloat(vb[3]), h = parseFloat(vb[4]);
        if (w > 0 && h > 0) return { w, h };
      }
      // 兜底:width/height 带 mm/cm/pt/in 单位(如 macOS 打印导出的 SVG),换算成 px
      const mm = /<svg[^>]*\swidth="([\d.]+)(mm|cm|pt|in)"[^>]*\sheight="([\d.]+)(mm|cm|pt|in)"/.exec(text)
        || /<svg[^>]*\sheight="([\d.]+)(mm|cm|pt|in)"[^>]*\swidth="([\d.]+)(mm|cm|pt|in)"/.exec(text);
      if (mm && mm[1] && mm[3]) {
        const ratio = { mm: 96 / 25.4, cm: 96 / 2.54, pt: 96 / 72, in: 96 };
        return { w: parseFloat(mm[1]) * ratio[mm[2]], h: parseFloat(mm[3]) * ratio[mm[4]] };
      }
      return { w: fallback, h: fallback };
    }

    window.saveForm = async (id) => {
      const t = TABLES[current];
      const payload = {};
      for (const c of t.cols) {
        const el = document.getElementById(`f_${c.k}`);
        if (!el) continue;
        if (c.type === 'bool') { payload[c.k] = el.checked; continue; }
        let v = el.value.trim();
        if (c.type === 'select' && c.ref) { v = Number(v); if (!v && c.optional) v = null; }
        if (c.type === 'number') v = v === '' ? null : Number(v);
        if (c.type === 'datetime') v = v === '' ? null : new Date(v).toISOString();
        if (c.req && (v === '' || v === null || v === undefined)) { alert('请填写「' + c.l + '」'); return; }
        if (c.req && c.type === 'select' && c.ref && !v) { alert('请选择「' + c.l + '」'); return; }
        payload[c.k] = v;
      }
      const { error } = id
        ? await supabase.from(current).update(payload).eq('id', id)
        : await supabase.from(current).insert(payload);
      if (error) { alert('保存失败: ' + error.message); return; }
      closeModal();
      await loadTable();
    };

    window.delRow = async (id) => {
      if (!confirm('确认删除这条记录?')) return;
      const { error } = await supabase.from(current).delete().eq('id', id);
      if (error) { alert('删除失败: ' + error.message); return; }
      await loadTable();
    };

    // 启动:有会话直接进,否则显示登录
    supabase.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'none';
        document.getElementById('resetpw').style.display = 'block';
      }
    });
    const { data: { session } } = await supabase.auth.getSession();
    if (session) { await checkAdmin(); }
  </script>
</body>
</html>
